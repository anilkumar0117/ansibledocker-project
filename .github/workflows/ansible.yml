name: Ansible Docker CI/CD

on:
  push:
    branches:
      - main

jobs:

  # ============================================================
  # BUILD AND PUSH DOCKER IMAGE
  # ============================================================
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Get AWS Account ID
        id: account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

          echo "AWS Account ID: $ACCOUNT_ID"

      - name: Create ECR Repository
        run: |
          if ! aws ecr describe-repositories \
            --repository-name anil-docker \
            --region ap-south-1 \
            >/dev/null 2>&1
          then
            echo "Creating ECR repository..."

            aws ecr create-repository \
              --repository-name anil-docker \
              --region ap-south-1
          else
            echo "ECR repository already exists."
          fi

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build \
            -f app/Dockerfile \
            -t anil-docker:latest \
            app/

      - name: Tag Docker Image
        run: |
          docker tag \
            anil-docker:latest \
            ${{ steps.account.outputs.account_id }}.dkr.ecr.ap-south-1.amazonaws.com/anil-docker:latest

      - name: Push Docker Image to ECR
        run: |
          docker push \
            ${{ steps.account.outputs.account_id }}.dkr.ecr.ap-south-1.amazonaws.com/anil-docker:latest


  # ============================================================
  # DEPLOY USING SSM + ANSIBLE
  # ============================================================
  deploy:
    name: Deploy using SSM and Ansible
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Run Ansible Playbook through SSM
        shell: bash
        run: |

          echo "========================================"
          echo "Sending command to Ansible Host"
          echo "========================================"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.ANSIBLE_HOST_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Docker application using Ansible" \
            --parameters 'commands=["sudo -iu ansibleadmin bash -lc '\''cd /home/ansibleadmin/ansible-project && ansible-playbook project-playbook.yaml -vv'\''"]' \
            --region ap-south-1 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "========================================"
          echo "Waiting for Ansible deployment..."
          echo "========================================"

          DEPLOYMENT_FINISHED=false

          for i in {1..60}
          do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.ANSIBLE_HOST_INSTANCE_ID }}" \
              --region ap-south-1 \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Current status: $STATUS"

            # ----------------------------------------------------
            # SUCCESS
            # ----------------------------------------------------
            if [ "$STATUS" = "Success" ]; then

              DEPLOYMENT_FINISHED=true

              echo "========================================"
              echo "Ansible deployment successful!"
              echo "========================================"

              break

            fi

            # ----------------------------------------------------
            # FAILURE
            # ----------------------------------------------------
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then

              echo "========================================"
              echo "Ansible deployment failed!"
              echo "========================================"

              echo ""
              echo "---------- STANDARD ERROR ----------"

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.ANSIBLE_HOST_INSTANCE_ID }}" \
                --region ap-south-1 \
                --query "StandardErrorContent" \
                --output text

              echo ""
              echo "---------- STANDARD OUTPUT ----------"

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.ANSIBLE_HOST_INSTANCE_ID }}" \
                --region ap-south-1 \
                --query "StandardOutputContent" \
                --output text

              exit 1

            fi

            sleep 5

          done

          # ------------------------------------------------------
          # TIMEOUT
          # ------------------------------------------------------
          if [ "$DEPLOYMENT_FINISHED" = false ]; then

            echo "========================================"
            echo "Deployment timed out!"
            echo "========================================"

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.ANSIBLE_HOST_INSTANCE_ID }}" \
              --region ap-south-1 \
              --query "StandardErrorContent" \
              --output text

            exit 1

          fi

          # ------------------------------------------------------
          # DISPLAY ANSIBLE OUTPUT
          # ------------------------------------------------------
          echo "========================================"
          echo "ANSIBLE OUTPUT"
          echo "========================================"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.ANSIBLE_HOST_INSTANCE_ID }}" \
            --region ap-south-1 \
            --query "StandardOutputContent" \
            --output text

          echo "========================================"
          echo "DEPLOYMENT COMPLETED"
          echo "========================================"
