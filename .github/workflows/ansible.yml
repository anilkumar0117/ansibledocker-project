name: Ansible CI/CD

on:
  push:
    branches:
      - main

jobs:

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Create ECR Repository if it does not exist
        run: |
          if ! aws ecr describe-repositories \
            --repository-name anil-docker >/dev/null 2>&1; then

            aws ecr create-repository \
              --repository-name anil-docker

          fi

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build \
            -f app/Dockerfile \
            -t anil-docker:latest \
            app/

      - name: Tag Docker Image
        run: |
          docker tag \
            anil-docker:latest \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com/anil-docker:latest

      - name: Push Docker Image to ECR
        run: |
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com/anil-docker:latest


  deploy:
    name: Deploy using Ansible
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Execute Ansible Playbook
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ANSIBLE_HOST }}
          username: ansibleadmin
          key: ${{ secrets.KEY }}
          port: 22

          script: |
            cd /home/ansibleadmin/ansible-project

            echo "Starting Ansible deployment..."

            ansible-playbook project-playbook.yaml -vv

            echo "Deployment completed successfully!"
