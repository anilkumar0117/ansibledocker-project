name: Ansible Docker CI/CD

on:
  push:
    branches:
      - main

jobs:

  # ==================================================
  # JOB 1: BUILD AND PUSH DOCKER IMAGE TO AMAZON ECR
  # ==================================================
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------
      # Checkout GitHub Repository
      # -----------------------------------------------
      - name: Checkout Source Code
        uses: actions/checkout@v4


      # -----------------------------------------------
      # Configure AWS Credentials
      # -----------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2


      # -----------------------------------------------
      # Get AWS Account ID Automatically
      # -----------------------------------------------
      - name: Get AWS Account ID
        id: account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

          echo "AWS Account ID: $ACCOUNT_ID"


      # -----------------------------------------------
      # Create ECR Repository If It Does Not Exist
      # -----------------------------------------------
      - name: Create ECR Repository
        run: |
          if ! aws ecr describe-repositories \
            --repository-name anil-docker \
            >/dev/null 2>&1; then

            echo "Creating ECR repository..."

            aws ecr create-repository \
              --repository-name anil-docker

          else

            echo "ECR repository already exists."

          fi


      # -----------------------------------------------
      # Login to Amazon ECR
      # -----------------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # -----------------------------------------------
      # Build Docker Image
      #
      # Dockerfile:
      # app/Dockerfile
      #
      # Build Context:
      # app/
      # -----------------------------------------------
      - name: Build Docker Image
        run: |
          docker build \
            -f app/Dockerfile \
            -t anil-docker:latest \
            app/


      # -----------------------------------------------
      # Tag Docker Image
      # -----------------------------------------------
      - name: Tag Docker Image
        run: |
          docker tag \
            anil-docker:latest \
            ${{ steps.account.outputs.account_id }}.dkr.ecr.us-west-2.amazonaws.com/anil-docker:latest


      # -----------------------------------------------
      # Push Docker Image to ECR
      # -----------------------------------------------
      - name: Push Docker Image to ECR
        run: |
          docker push \
            ${{ steps.account.outputs.account_id }}.dkr.ecr.us-west-2.amazonaws.com/anil-docker:latest


  # ==================================================
  # JOB 2: DEPLOY USING ANSIBLE
  # ==================================================
  deploy:
    name: Deploy using Ansible
    needs: build
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------
      # SSH INTO ANSIBLE HOST
      #
      # GitHub Secret KEY contains:
      # ~/.ssh/id_rsa
      # -----------------------------------------------
      - name: Connect to Ansible Host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ANSIBLE_HOST }}
          username: ansibleadmin
          key: ${{ secrets.KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          debug: true

          script: |

            echo "========================================"
            echo "Connected to Ansible Host"
            echo "========================================"

            whoami
            hostname

            echo "========================================"
            echo "Going to Ansible Project"
            echo "========================================"

            cd /home/ansibleadmin/ansible-project

            echo "========================================"
            echo "Running Ansible Playbook"
            echo "========================================"

            ansible-playbook project-playbook.yaml -vv

            echo "========================================"
            echo "Deployment Completed Successfully"
            echo "========================================"
