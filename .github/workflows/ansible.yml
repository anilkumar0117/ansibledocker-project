```yaml
name: Ansible Docker CI/CD

on:
  push:
    branches:
      - main

jobs:

  # ==================================================
  # JOB 1: BUILD AND PUSH DOCKER IMAGE TO AMAZON ECR
  # ==================================================
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Configure AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # Get AWS Account ID
      - name: Get AWS Account ID
        id: account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

          echo "AWS Account ID: $ACCOUNT_ID"

      # Create ECR repository if it doesn't exist
      - name: Create ECR Repository
        run: |
          if ! aws ecr describe-repositories \
            --repository-name anil-docker \
            >/dev/null 2>&1; then

            echo "Creating ECR repository..."

            aws ecr create-repository \
              --repository-name anil-docker

          else

            echo "ECR repository already exists."

          fi

      # Login to ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -f app/Dockerfile \
            -t anil-docker:latest \
            app/

      # Tag Docker image
      - name: Tag Docker Image
        run: |
          docker tag \
            anil-docker:latest \
            ${{ steps.account.outputs.account_id }}.dkr.ecr.ap-south-1.amazonaws.com/anil-docker:latest

      # Push Docker image
      - name: Push Docker Image to ECR
        run: |
          docker push \
            ${{ steps.account.outputs.account_id }}.dkr.ecr.ap-south-1.amazonaws.com/anil-docker:latest


  # ==================================================
  # JOB 2: DEPLOY USING AWS SSM + ANSIBLE
  # ==================================================
  deploy:
    name: Deploy using SSM and Ansible
    needs: build
    runs-on: ubuntu-latest

    steps:

      # Configure AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # Run Ansible through SSM
      - name: Run Ansible Playbook through SSM
        shell: bash
        run: |

          echo "========================================"
          echo "Sending command to Ansible Host"
          echo "========================================"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.ANSIBLE_HOST_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Docker application using Ansible" \
            --parameters 'commands=[
              "cd /home/ansibleadmin/ansible-project",
              "ansible-playbook project-playbook.yaml -vv"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "========================================"
          echo "Waiting for Ansible deployment..."
          echo "========================================"

          for i in {1..60}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.ANSIBLE_HOST_INSTANCE_ID }}" \
              --query "Status" \
              --output text)

            echo "Current status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "========================================"
              echo "Ansible deployment successful!"
              echo "========================================"
              break
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then

              echo "========================================"
              echo "Ansible deployment failed!"
              echo "========================================"

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.ANSIBLE_HOST_INSTANCE_ID }}" \
                --query "StandardErrorContent" \
                --output text
```
